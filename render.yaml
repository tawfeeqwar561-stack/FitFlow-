databases:
  - name: fitflow-db
    plan: free
    databaseName: fitflow
    user: fitflow_user

services:
  # ── Backend (FastAPI) ──────────────────────────────────
  - type: web
    name: fitflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: FitFlow
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fitflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: FRONTEND_URL
        value: https://fitflow-frontend.onrender.com
      - key: CLARIFAI_PAT
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.13.0"

  # ── Frontend (React Static Site) ───────────────────────
  - type: web
    name: fitflow-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://fitflow-backend.onrender.com/api
